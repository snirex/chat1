<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>צ'אט מתורגם בזמן אמת</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-message {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-full flex flex-col transition-colors duration-200">

  <!-- מסך כניסה/יצירת חדר -->
  <div id="roomSelectionScreen" class="fixed inset-0 z-50 bg-gray-100 dark:bg-gray-900 flex flex-col justify-center items-center p-4 transition-all">
    <div class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-100 dark:border-gray-700 space-y-6">
      
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent">צ'אט מתורגם בזמן אמת</h1>
        <button id="themeToggleLogin" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-200 hover:opacity-80 transition">
          🌙
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-500 dark:text-gray-400">בחר את השפה שלך</label>
          <select id="userLanguage" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="he">עברית (Hebrew)</option>
            <option value="en">אנגלית (English)</option>
            <option value="es">ספרדית (Spanish)</option>
            <option value="fr">צרפתית (French)</option>
            <option value="ru">רוסית (Russian)</option>
            <option value="ar">ערבית (Arabic)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-500 dark:text-gray-400">קוד חדר פרטי</label>
          <input type="text" id="roomCodeInput" placeholder="למשל: 1234 או my-room" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none uppercase tracking-wider" dir="ltr">
        </div>

        <button id="joinRoomBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/30 active:scale-[0.98] transition-all">
          היכנס לחדר
        </button>
      </div>
    </div>
  </div>

  <!-- מסך הצ'אט הראשי -->
  <div id="chatScreen" class="hidden flex-col h-full max-w-2xl w-full mx-auto shadow-2xl relative bg-white dark:bg-gray-800">
    
    <!-- Header -->
    <header class="p-3 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button id="leaveRoomBtn" class="p-2 rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          ➡️
        </button>
        <div>
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <h2 id="currentRoomTitle" class="font-bold text-sm">חדר: ---</h2>
          </div>
          <span id="currentLangBadge" class="text-[10px] text-gray-400 dark:text-gray-500 block">שפה: עברית</span>
        </div>
      </div>

      <button id="themeToggleChat" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-200">
        🌙
      </button>
    </header>

    <!-- אזור ההודעות -->
    <main id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 dark:bg-gray-900/50">
      <!-- ההודעות ייטענו לכאן -->
    </main>

    <!-- אזור הזנת הודעה -->
    <footer class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 sticky bottom-0">
      <form id="messageForm" class="flex items-center gap-2">
        <input type="text" id="messageInput" placeholder="קלד הודעה..." class="flex-1 bg-gray-100 dark:bg-gray-700 border-0 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition" required autocomplete="off">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-2xl font-semibold shadow-md active:scale-95 transition flex items-center justify-center">
          <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        </button>
      </form>
    </footer>

  </div>

  <script>
    // הגדרות Firebase
    const firebaseConfig = {
      databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app"  
    };
    firebase.initializeApp(firebaseConfig);

    const userId = "user_" + Math.random().toString(36).substr(2, 7);
    let currentRoomRef = null;
    let currentRoomId = null;
    let myLanguage = "he";

    // אלמנטים ב-DOM
    const roomSelectionScreen = document.getElementById('roomSelectionScreen');
    const chatScreen = document.getElementById('chatScreen');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const userLanguageSelect = document.getElementById('userLanguage');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const currentRoomTitle = document.getElementById('currentRoomTitle');
    const currentLangBadge = document.getElementById('currentLangBadge');
    const chatBox = document.getElementById('chatBox');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');

    // ניהול מצב לילה / יום (Dark Mode)
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeToggleLogin').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeToggleChat').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('themeToggleLogin').innerText = '☀️';
      document.getElementById('themeToggleChat').innerText = '☀️';
    }

    document.getElementById('themeToggleLogin').addEventListener('click', toggleDarkMode);
    document.getElementById('themeToggleChat').addEventListener('click', toggleDarkMode);

    // פונקציית תרגום (Google Translate)
    async function translateText(text, targetLang) {
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (err) {
        return text;
      }
    }

    // כניסה לחדר
    joinRoomBtn.addEventListener('click', () => {
      const rawRoomCode = roomCodeInput.value.trim().toLowerCase();
      if (!rawRoomCode) {
        alert('נא להזין קוד חדר');
        return;
      }

      currentRoomId = rawRoomCode.replace(/[^a-z0-9_-]/g, ''); // ניקוי תוים מיוחדים
      myLanguage = userLanguageSelect.value;

      currentRoomTitle.innerText = `חדר: ${currentRoomId}`;
      currentLangBadge.innerText = `שפה: ${userLanguageSelect.options[userLanguageSelect.selectedIndex].text.split(' ')[0]}`;

      roomSelectionScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      chatScreen.classList.add('flex');

      // התחברות אל Firebase לחדר הדינמי
      chatBox.innerHTML = '';
      currentRoomRef = firebase.database().ref(`chats/${currentRoomId}`);

      currentRoomRef.limitToLast(50).on('child_added', async (snapshot) => {
        const msg = snapshot.val();
        const isMe = msg.sender === userId;
        const translatedText = isMe ? msg.text : await translateText(msg.text, myLanguage);
        appendMessage(translatedText, msg.text, isMe);
      });
    });

    // יציאה מחדר
    leaveRoomBtn.addEventListener('click', () => {
      if (currentRoomRef) {
        currentRoomRef.off(); // הפסקת האזנה ל-Firebase
      }
      chatScreen.classList.add('hidden');
      chatScreen.classList.remove('flex');
      roomSelectionScreen.classList.remove('hidden');
    });

    // שליחת הודעה
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentRoomRef) return;

      currentRoomRef.push({
        sender: userId,
        text: text,
        timestamp: Date.now()
      });

      messageInput.value = '';
    });

    // הוספת הודעה למסך עם אנימציה
    function appendMessage(textToShow, originalText, isMe) {
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `flex flex-col ${isMe ? 'items-start' : 'items-end'} animate-message`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] sm:max-w-[70%] p-3.5 rounded-2xl shadow-sm text-sm ${
        isMe 
          ? 'bg-indigo-600 text-white rounded-br-none' 
          : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-100 dark:border-gray-700 rounded-bl-none'
      }`;

      const subText = !isMe ? `<div class="text-[10px] opacity-60 mt-1.5 pt-1 border-t border-gray-200/40">מקור: ${originalText}</div>` : '';

      msgDiv.innerHTML = `<div class="break-words">${textToShow}</div>${subText}`;
      msgWrapper.appendChild(msgDiv);
      chatBox.appendChild(msgWrapper);
      
      // גלילה חלקה למטה
      chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
</html>
