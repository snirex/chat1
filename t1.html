<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>צ'אט מתורגם בזמן אמת</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-msg { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-full flex flex-col transition-colors">

  <!-- מסך כניסה ורשימת חדרים -->
  <div id="roomSelectionScreen" class="fixed inset-0 z-50 bg-gray-100 dark:bg-gray-900 flex flex-col justify-between items-center p-4 overflow-y-auto">
    
    <div></div>

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-100 dark:border-gray-700 space-y-5 my-auto">
      
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent">צ'אט מתורגם</h1>
        <button id="themeToggleLogin" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700">🌙</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-500 dark:text-gray-400">השפה שלי</label>
          <select id="userLanguage" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="he">עברית (Hebrew)</option>
            <option value="en">אנגלית (English)</option>
            <option value="es">ספרדית (Spanish)</option>
            <option value="fr">צרפתית (French)</option>
            <option value="ru">רוסית (Russian)</option>
            <option value="ar">ערבית (Arabic)</option>
            <option value="si">סינהלית - סרי לנקה (Sinhala)</option>
            <option value="ta">טמילית - סרי לנקה (Tamil)</option>
            <option value="sw">סוואהילית (Swahili)</option>
            <option value="ADD_MORE" class="font-bold text-indigo-600 dark:text-indigo-400">➕ הוסף שפה נוספת...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-500 dark:text-gray-400">קוד חדר</label>
          <input type="text" id="roomCodeInput" placeholder="למשל: 123" value="" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-bold" dir="ltr">
        </div>

        <button id="joinRoomBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg active:scale-95 transition">
          היכנס לחדר
        </button>
      </div>

      <hr class="border-gray-200 dark:border-gray-700">

      <!-- רשימת חדרים שהיו בשימוש -->
      <div>
        <h2 class="text-xs font-semibold mb-2 text-gray-500 dark:text-gray-400 flex justify-between items-center">
          <span>חדרים במערכת</span>
          <span id="activeRoomsCount" class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 px-2 py-0.5 rounded-full text-[10px]">0</span>
        </h2>
        <div id="activeRoomsList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
          <div class="text-center text-xs text-gray-400 py-3">אין חדרים במערכת כעת</div>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-xs text-gray-500 dark:text-gray-400 space-y-1">
      <p>
        בנוי על ידי <span class="font-bold text-indigo-600 dark:text-indigo-400">שניר אלגבסי</span> © 2026
      </p>
      <p>
        This chat was made by <span class="font-bold text-indigo-600 dark:text-indigo-400">Snir Elgabsi</span> © 2026
      </p>
      <div class="flex justify-center gap-3 text-[11px] text-gray-400 dark:text-gray-500">
        <a href="https://github.com/snirex" target="_blank" class="hover:text-indigo-500 transition font-medium">GitHub</a>
        <span>•</span>
        <a href="https://www.linkedin.com/in/snir-elgabsi" target="_blank" class="hover:text-indigo-500 transition font-medium">LinkedIn</a>
        <span>•</span>
        <a href="mailto:elsnir@gmail.com" class="hover:text-indigo-500 transition font-medium">צור קשר</a>
      </div>
    </footer>

  </div>

  <!-- מסך צ'אט -->
  <div id="chatScreen" class="hidden flex-col h-full max-w-2xl w-full mx-auto bg-white dark:bg-gray-800 shadow-2xl relative">
    
    <header class="p-3 bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b border-gray-200 dark:border-gray-700 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button id="leaveRoomBtn" class="p-2 rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700">➡️</button>
        <div>
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
            <h2 id="currentRoomTitle" class="font-bold text-sm">חדר: ---</h2>
            <button id="lockRoomBtn" title="נעול/שחרר חדר" class="text-xs p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
              🔓
            </button>
            <button id="shareRoomBtn" title="שיתוף חדר וקוד QR" class="text-xs p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
              🔗
            </button>
          </div>
          <div class="flex items-center gap-2 text-[10px] text-gray-400">
            <span id="currentLangBadge">שפה: עברית</span>
            <span>•</span>
            <span id="onlineUsersCount">👥 1 מחוברים</span>
          </div>
        </div>
      </div>
      <button id="themeToggleChat" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700">🌙</button>
    </header>

    <main id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 dark:bg-gray-900/40">
      <!-- הודעות -->
    </main>

    <!-- חיווי מקליד/ה -->
    <div id="typingIndicator" class="hidden px-4 py-1 text-xs text-gray-400 dark:text-gray-500 italic bg-gray-50 dark:bg-gray-900/40">
      מישהו מקליד...
    </div>

    <!-- תצוגה מקדימה לתמונה -->
    <div id="imagePreviewContainer" class="hidden px-4 py-2 bg-gray-100 dark:bg-gray-700 border-t border-gray-200 dark:border-gray-600 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded-lg border">
        <span class="text-xs text-gray-500 dark:text-gray-300">תמונה מוכנה לשליחה</span>
      </div>
      <button id="cancelImageBtn" class="text-xs text-red-500 hover:underline">בטל</button>
    </div>

    <footer class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 sticky bottom-0">
      <form id="messageForm" class="flex items-center gap-2">
        <label for="imageInput" class="p-3 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-2xl cursor-pointer text-gray-600 dark:text-gray-300 transition flex items-center justify-center">
          📷
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <button type="button" id="micBtn" class="p-3 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-2xl text-gray-600 dark:text-gray-300 transition flex items-center justify-center">
          🎙️
        </button>

        <input type="text" id="messageInput" placeholder="הקלד הודעה..." class="flex-1 bg-gray-100 dark:bg-gray-700 border-0 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
        
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-2xl font-semibold active:scale-95 transition">
          <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        </button>
      </form>
    </footer>

  </div>

  <!-- Modal שיתוף ו-QR -->
  <div id="shareModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
      <h3 class="font-bold text-lg text-gray-800 dark:text-white">שתף את החדר</h3>
      <div id="qrcode" class="flex justify-center p-2 bg-white rounded-xl shadow-inner my-2"></div>
      <p class="text-xs text-gray-500 dark:text-gray-400">סרוק בטלפון או העתק את הקישור למטה</p>
      <input type="text" id="shareUrlInput" readonly class="w-full bg-gray-100 dark:bg-gray-700 p-2.5 rounded-xl text-xs text-center border font-mono outline-none" dir="ltr">
      <div class="flex gap-2">
        <button id="copyShareUrlBtn" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-semibold hover:bg-indigo-700 transition">העתק קישור</button>
        <button onclick="closeShareModal()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl text-xs font-semibold">סגור</button>
      </div>
    </div>
  </div>

  <!-- Modal בחירת שפה נוספת -->
  <div id="addLanguageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <h3 class="font-bold text-lg text-gray-800 dark:text-white text-center">בחר שפה להוספה</h3>
      <select id="extraLanguagesSelect" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="de">גרמנית (German)</option>
        <option value="it">איטלקית (Italian)</option>
        <option value="pt">פורטוגזית (Portuguese)</option>
        <option value="zh">סינית (Chinese)</option>
        <option value="ja">יפנית (Japanese)</option>
        <option value="ko">קוריאנית (Korean)</option>
        <option value="hi">הינדי (Hindi)</option>
        <option value="th">תאילנדית (Thai)</option>
        <option value="vi">וייטנאמית (Vietnamese)</option>
        <option value="uk">אוקראינית (Ukrainian)</option>
        <option value="pl">פולנית (Polish)</option>
        <option value="tr">טורקית (Turkish)</option>
        <option value="nl">הולנדית (Dutch)</option>
      </select>
      <div class="flex gap-2">
        <button id="confirmAddLangBtn" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-semibold hover:bg-indigo-700 transition">הוסף לרשימה שלי</button>
        <button onclick="closeAddLangModal()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl text-xs font-semibold">ביטול</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // שמירת userId קבוע ב-localStorage
    let userId = localStorage.getItem('chat_user_id');
    if (!userId) {
      userId = "user_" + Math.random().toString(36).substr(2, 7);
      localStorage.setItem('chat_user_id', userId);
    }

    let currentRoomId = null;
    let currentRoomRef = null;
    let roomMetaRef = null;
    let myPresenceRef = null;
    let myLanguage = "he";
    let selectedImageBase64 = null;
    let isRoomLocked = false;
    let unlockedByUsersFlag = false;
    let typingTimeout = null;

    const userLanguageSelect = document.getElementById('userLanguage');
    const addLanguageModal = document.getElementById('addLanguageModal');
    const extraLanguagesSelect = document.getElementById('extraLanguagesSelect');
    const confirmAddLangBtn = document.getElementById('confirmAddLangBtn');

    // טעינת שפות מותאמות אישית
    function loadCustomLanguages() {
      const customLangs = JSON.parse(localStorage.getItem('custom_user_languages') || '[]');
      customLangs.forEach(lang => {
        if (!userLanguageSelect.querySelector(`option[value="${lang.code}"]`)) {
          const opt = document.createElement('option');
          opt.value = lang.code;
          opt.innerText = lang.name;
          userLanguageSelect.insertBefore(opt, userLanguageSelect.lastElementChild);
        }
      });
    }
    loadCustomLanguages();

    userLanguageSelect.addEventListener('change', (e) => {
      if (e.target.value === 'ADD_MORE') {
        addLanguageModal.classList.remove('hidden');
        userLanguageSelect.value = myLanguage;
      } else {
        myLanguage = e.target.value;
      }
    });

    window.closeAddLangModal = function() {
      addLanguageModal.classList.add('hidden');
    };

    confirmAddLangBtn.addEventListener('click', () => {
      const selectedCode = extraLanguagesSelect.value;
      const selectedText = extraLanguagesSelect.options[extraLanguagesSelect.selectedIndex].text;

      let customLangs = JSON.parse(localStorage.getItem('custom_user_languages') || '[]');
      if (!customLangs.some(l => l.code === selectedCode)) {
        customLangs.push({ code: selectedCode, name: selectedText });
        localStorage.setItem('custom_user_languages', JSON.stringify(customLangs));
      }

      loadCustomLanguages();
      userLanguageSelect.value = selectedCode;
      myLanguage = selectedCode;
      closeAddLangModal();
    });

    const roomSelectionScreen = document.getElementById('roomSelectionScreen');
    const chatScreen = document.getElementById('chatScreen');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const lockRoomBtn = document.getElementById('lockRoomBtn');
    const shareRoomBtn = document.getElementById('shareRoomBtn');
    const currentRoomTitle = document.getElementById('currentRoomTitle');
    const currentLangBadge = document.getElementById('currentLangBadge');
    const onlineUsersCount = document.getElementById('onlineUsersCount');
    const chatBox = document.getElementById('chatBox');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const imageInput = document.getElementById('imageInput');
    const micBtn = document.getElementById('micBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const cancelImageBtn = document.getElementById('cancelImageBtn');
    const activeRoomsList = document.getElementById('activeRoomsList');

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) {
      roomCodeInput.value = urlParams.get('room');
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeToggleLogin').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeToggleChat').innerText = isDark ? '☀️' : '🌙';
    }
    document.getElementById('themeToggleLogin').addEventListener('click', toggleDarkMode);
    document.getElementById('themeToggleChat').addEventListener('click', toggleDarkMode);

    window.speakText = function(text, langCode) {
      if (!('speechSynthesis' in window)) return alert('הדפדפן שלך אינו תומך בהקראת קול');
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      window.speechSynthesis.speak(utterance);
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      micBtn.addEventListener('click', () => {
        recognition.lang = myLanguage;
        recognition.start();
        micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        messageInput.value = transcript;
        micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
      };

      recognition.onerror = () => {
        micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
      };

      recognition.onend = () => {
        micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
      };
    } else {
      micBtn.style.display = 'none';
    }

    messageInput.addEventListener('input', () => {
      if (!roomMetaRef) return;
      roomMetaRef.child(`typing/${userId}`).set(true);

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        if (roomMetaRef) roomMetaRef.child(`typing/${userId}`).remove();
      }, 2000);
    });

    shareRoomBtn.addEventListener('click', () => {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
      document.getElementById('shareUrlInput').value = shareUrl;
      
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: shareUrl, width: 140, height: 140 });

      document.getElementById('shareModal').classList.remove('hidden');
    });

    document.getElementById('copyShareUrlBtn').addEventListener('click', () => {
      const urlInput = document.getElementById('shareUrlInput');
      urlInput.select();
      navigator.clipboard.writeText(urlInput.value);
      alert('הקישור הועתק ללוח!');
    });

    window.closeShareModal = function() {
      document.getElementById('shareModal').classList.add('hidden');
    };

    // טעינת חדרים שהיו בשימוש
    db.ref().on('value', (snapshot) => {
      const rootData = snapshot.val() || {};
      const chats = rootData.chats || {};
      const meta = rootData.room_meta || {};

      activeRoomsList.innerHTML = '';
      const allRoomIds = Array.from(new Set([...Object.keys(chats), ...Object.keys(meta)]));

      if (allRoomIds.length === 0) {
        activeRoomsList.innerHTML = `<div class="text-center text-xs text-gray-400 py-3">אין חדרים במערכת כעת</div>`;
        document.getElementById('activeRoomsCount').innerText = '0';
        return;
      }

      document.getElementById('activeRoomsCount').innerText = allRoomIds.length;

      allRoomIds.forEach((rId) => {
        const roomMeta = meta[rId] || {};
        const activeUsersCount = roomMeta.users ? Object.keys(roomMeta.users).length : 0;
        const isLocked = roomMeta.locked || false;

        const roomCard = document.createElement('div');
        roomCard.className = "flex justify-between items-center p-2.5 bg-gray-50 dark:bg-gray-700/60 rounded-xl border border-gray-100 dark:border-gray-600 hover:border-indigo-300 transition cursor-pointer";
        roomCard.onclick = () => { roomCodeInput.value = rId; };

        const statusBadge = activeUsersCount > 0 
          ? `<span class="flex items-center gap-1 text-[11px] bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 px-2 py-0.5 rounded-md font-semibold">
               <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
               ${activeUsersCount} מחוברים
             </span>`
          : `<span class="text-[11px] bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md font-normal">
               ⚪ לא פעיל
             </span>`;

        roomCard.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold font-mono text-gray-700 dark:text-gray-200">${rId}</span>
            <span class="text-xs">${isLocked ? '🔒' : '🔓'}</span>
          </div>
          ${statusBadge}
        `;
        activeRoomsList.appendChild(roomCard);
      });
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
          imagePreview.src = selectedImageBase64;
          imagePreviewContainer.classList.remove('hidden');
          imagePreviewContainer.classList.add('flex');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    cancelImageBtn.addEventListener('click', () => {
      selectedImageBase64 = null;
      imageInput.value = '';
      imagePreviewContainer.classList.add('hidden');
      imagePreviewContainer.classList.remove('flex');
    });

    async function translateText(text, targetLang) {
      if (!text) return '';
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (err) {
        return text;
      }
    }

    joinRoomBtn.addEventListener('click', async () => {
      const rawRoomCode = roomCodeInput.value.trim().toLowerCase();
      if (!rawRoomCode) return alert('נא להזין קוד חדר');

      currentRoomId = rawRoomCode.replace(/[^a-z0-9_-]/g, '');
      myLanguage = userLanguageSelect.value;

      const roomSnap = await db.ref(`room_meta/${currentRoomId}`).once('value');
      const roomMeta = roomSnap.val();

      if (roomMeta && roomMeta.locked) {
        const isUserInside = roomMeta.users && roomMeta.users[userId];
        if (!isUserInside) {
          alert('🔒 חדר זה נעול לכניסת משתמשים חדשים!');
          return;
        }
      }

      currentRoomTitle.innerText = `חדר: ${currentRoomId}`;
      currentLangBadge.innerText = `שפה: ${userLanguageSelect.options[userLanguageSelect.selectedIndex].text.split(' ')[0]}`;

      roomSelectionScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      chatScreen.classList.add('flex');

      chatBox.innerHTML = '';
      currentRoomRef = db.ref(`chats/${currentRoomId}`);
      roomMetaRef = db.ref(`room_meta/${currentRoomId}`);

      myPresenceRef = db.ref(`room_meta/${currentRoomId}/users/${userId}`);
      myPresenceRef.set(true);
      myPresenceRef.onDisconnect().remove();

      roomMetaRef.on('value', (snap) => {
        const data = snap.val() || {};
        isRoomLocked = data.locked || false;
        unlockedByUsersFlag = data.unlockedByUsers || false;

        lockRoomBtn.innerText = isRoomLocked ? '🔒' : '🔓';
        
        const users = data.users || {};
        const usersCount = Object.keys(users).length;
        onlineUsersCount.innerText = `👥 ${usersCount} מחוברים`;

        if (usersCount >= 2 && !isRoomLocked && !unlockedByUsersFlag) {
          roomMetaRef.child('locked').set(true);
        }

        if (data.typing) {
          const typers = Object.keys(data.typing).filter(id => id !== userId);
          if (typers.length > 0) {
            typingIndicator.classList.remove('hidden');
          } else {
            typingIndicator.classList.add('hidden');
          }
        } else {
          typingIndicator.classList.add('hidden');
        }
      });

      currentRoomRef.limitToLast(50).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        const msgKey = snapshot.key;
        const isMe = msg.sender === userId;

        appendMessageElement(msgKey, isMe ? msg.text : "מתרגם...", msg.text, msg.image, isMe);

        if (!isMe && msg.text) {
          translateText(msg.text, myLanguage).then(translated => {
            updateMessageText(msgKey, translated);
          });
        }
      });
    });

    lockRoomBtn.addEventListener('click', () => {
      if (!roomMetaRef) return;
      const nextLockState = !isRoomLocked;
      const updates = { locked: nextLockState };
      
      if (!nextLockState) {
        updates.unlockedByUsers = true;
      }

      roomMetaRef.update(updates);
    });

    leaveRoomBtn.addEventListener('click', () => {
      if (myPresenceRef) myPresenceRef.remove();
      if (currentRoomRef) currentRoomRef.off();
      if (roomMetaRef) roomMetaRef.off();

      chatScreen.classList.add('hidden');
      chatScreen.classList.remove('flex');
      roomSelectionScreen.classList.remove('hidden');
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      
      if ((!text && !selectedImageBase64) || !currentRoomRef) return;

      currentRoomRef.push({
        sender: userId,
        text: text || "",
        image: selectedImageBase64 || null,
        timestamp: Date.now()
      });

      if (roomMetaRef) roomMetaRef.child(`typing/${userId}`).remove();

      messageInput.value = '';
      cancelImageBtn.click();
    });

    function appendMessageElement(key, textToShow, originalText, imageUrl, isMe) {
      const wrapper = document.createElement('div');
      wrapper.id = `msg-${key}`;
      wrapper.className = `flex flex-col ${isMe ? 'items-start' : 'items-end'} animate-msg`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] sm:max-w-[70%] p-3.5 rounded-2xl shadow-sm text-sm ${
        isMe 
          ? 'bg-indigo-600 text-white rounded-br-none' 
          : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-100 dark:border-gray-700 rounded-bl-none'
      }`;

      let imgHtml = imageUrl ? `<a href="${imageUrl}" target="_blank"><img src="${imageUrl}" class="rounded-xl mb-2 max-h-60 w-full object-cover shadow-sm hover:opacity-95 transition"></a>` : '';
      let textHtml = textToShow ? `<div class="msg-content break-words">${textToShow}</div>` : '';
      let ttsBtn = (!isMe && textToShow) ? `<button onclick="speakText(this.previousElementSibling.innerText, '${myLanguage}')" class="text-xs opacity-70 hover:opacity-100 mt-1" title="הקרא הודעה">🔊 השמע</button>` : '';
      let subText = (!isMe && originalText) ? `<div class="text-[10px] opacity-60 mt-1.5 pt-1 border-t border-gray-200/30">מקור: ${originalText}</div>` : '';

      msgDiv.innerHTML = `${imgHtml}${textHtml}${ttsBtn}${subText}`;
      wrapper.appendChild(msgDiv);
      chatBox.appendChild(wrapper);

      chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    function updateMessageText(key, newText) {
      const wrapper = document.getElementById(`msg-${key}`);
      if (wrapper) {
        const contentDiv = wrapper.querySelector('.msg-content');
        if (contentDiv) contentDiv.innerText = newText;
      }
    }
  </script>
</body>
</html>
