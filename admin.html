<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פאנל ניהול - צ'אט מתורגם</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <span>🛠️</span> פאנל ניהול שיחות
        </h1>
        <p class="text-sm text-slate-500 mt-1">צפייה, עריכה ומחיקה של חדרים והודעות בזמן אמת</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="connectionStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          מתחבר...
        </span>
        <button onclick="loadAllData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
          🔄 רענן נתונים
        </button>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- רשימת חדרים (רשת שמאל/למעלה) -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col h-[70vh]">
        <h2 class="font-bold text-lg mb-3 flex justify-between items-center text-slate-800">
          <span>רשימת חדרים</span>
          <span id="roomCount" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div id="roomsList" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <div class="text-center text-slate-400 py-10 text-sm">טוען חדרים...</div>
        </div>
      </div>

      <!-- תצוגת ההודעות בחדר הנבחר (רשת ימין/למטה) -->
      <div class="lg:col-span-2 bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col h-[70vh]">
        
        <!-- כותרת החדר הנבחר -->
        <div class="border-b border-slate-100 pb-4 mb-4 flex justify-between items-center flex-wrap gap-2">
          <div>
            <h3 id="selectedRoomTitle" class="font-bold text-xl text-slate-900">בחר חדר לצפייה</h3>
            <span id="selectedRoomInfo" class="text-xs text-slate-400">יש לבחור חדר מרשימת החדרים מימין</span>
          </div>
          <button id="deleteRoomBtn" class="hidden bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition items-center gap-1">
            🗑️ מחק חדר זה לחלוטין
          </button>
        </div>

        <!-- אזור הצגת ההודעות -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto space-y-3 p-2 bg-slate-50/50 rounded-xl border border-slate-100">
          <div class="text-center text-slate-400 py-20 text-sm">טרם נבחר חדר</div>
        </div>

      </div>

    </div>

  </div>

  <!-- Modal לעריכת הודעה -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <h3 class="font-bold text-lg text-slate-800">עריכת הודעה</h3>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">תוכן ההודעה המעודכן</label>
        <textarea id="editInput" rows="4" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">ביטול</button>
        <button id="saveEditBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition">שמור שינויים</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ התאמת הגדרות Firebase
    const firebaseConfig = {
      databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app"   
        //"https://en-shemer-booking-default-rtdb.firebaseio.com" // not-europe url
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeRoomId = null;
    let editingMsgKey = null;

    // מעקב אחר חיבור ל-Firebase
    db.ref(".info/connected").on("value", (snap) => {
      const statusEl = document.getElementById("connectionStatus");
      if (snap.val() === true) {
        statusEl.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700";
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> מחובר`;
      } else {
        statusEl.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700";
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> מנותק`;
      }
    });

    // טעינת כל הנתונים
    function loadAllData() {
      db.ref("chats").on("value", (snapshot) => {
        const roomsList = document.getElementById("roomsList");
        const roomsData = snapshot.val();

        if (!roomsData) {
          roomsList.innerHTML = `<div class="text-center text-slate-400 py-10 text-sm">אין חדרים קיימים במערכת</div>`;
          document.getElementById("roomCount").innerText = "0";
          return;
        }

        const roomKeys = Object.keys(roomsData);
        document.getElementById("roomCount").innerText = roomKeys.length;
        roomsList.innerHTML = "";

        roomKeys.forEach((roomId) => {
          const messages = roomsData[roomId] ? Object.keys(roomsData[roomId]).length : 0;
          const isSelected = roomId === activeRoomId;

          const btn = document.createElement("button");
          btn.className = `w-full text-right p-3 rounded-xl transition flex justify-between items-center border ${
            isSelected 
              ? 'bg-indigo-50 border-indigo-200 text-indigo-900 font-bold' 
              : 'bg-white hover:bg-slate-50 border-slate-100 text-slate-700'
          }`;
          btn.onclick = () => selectRoom(roomId, roomsData[roomId]);

          btn.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span>💬</span>
              <span class="truncate">${roomId}</span>
            </div>
            <span class="text-xs bg-slate-100 px-2 py-1 rounded-md text-slate-500 font-normal">${messages} הודעות</span>
          `;
          roomsList.appendChild(btn);
        });

        // אם החדר האקטיבי עדיין פתוח, נעדכן את התצוגה שלו
        if (activeRoomId && roomsData[activeRoomId]) {
          renderMessages(roomsData[activeRoomId]);
        }
      });
    }

    // בחירת חדר
    function selectRoom(roomId, messagesData) {
      activeRoomId = roomId;
      document.getElementById("selectedRoomTitle").innerText = `חדר: ${roomId}`;
      
      const deleteRoomBtn = document.getElementById("deleteRoomBtn");
      deleteRoomBtn.classList.remove("hidden");
      deleteRoomBtn.classList.add("flex");
      deleteRoomBtn.onclick = () => deleteRoom(roomId);

      renderMessages(messagesData);
      loadAllData(); // מרענן את העיצוב ברשימה (הדגשת החדר שנבחר)
    }

    // הצגת ההודעות של החדר הנבחר
    function renderMessages(messagesData) {
      const container = document.getElementById("messagesContainer");
      container.innerHTML = "";

      if (!messagesData) {
        container.innerHTML = `<div class="text-center text-slate-400 py-20 text-sm">אין הודעות בחדר זה</div>`;
        document.getElementById("selectedRoomInfo").innerText = "0 הודעות";
        return;
      }

      const keys = Object.keys(messagesData);
      document.getElementById("selectedRoomInfo").innerText = `${keys.length} הודעות בזמן אמת`;

      keys.forEach((msgKey) => {
        const msg = messagesData[msgKey];
        const dateStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';

        const card = document.createElement("div");
        card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2 relative group";

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-50 pb-1.5">
            <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-[10px] text-slate-600">${msg.sender || 'אנונימי'}</span>
            <span>${dateStr}</span>
          </div>
          <div class="text-slate-800 text-sm break-words">${escapeHtml(msg.text)}</div>
          <div class="flex justify-end gap-3 pt-1 border-t border-slate-50">
            <button onclick="openEditModal('${msgKey}', \`${escapeJsString(msg.text)}\`)" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold transition">
              ✏️ ערוך
            </button>
            <button onclick="deleteMessage('${msgKey}')" class="text-xs text-red-500 hover:text-red-700 font-semibold transition">
              🗑️ מחק
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      container.scrollTop = container.scrollHeight;
    }

    // מחיקת הודעה בודדת
    function deleteMessage(msgKey) {
      if (!activeRoomId) return;
      if (confirm("האם אתה בטוח שברצונך למחוק הודעה זו?")) {
        db.ref(`chats/${activeRoomId}/${msgKey}`).remove()
          .then(() => console.log("ההודעה נמחקה בהצלחה"))
          .catch((err) => alert("שגיאה במחיקה: " + err.message));
      }
    }

    // מחיקת חדר שלם
    function deleteRoom(roomId) {
      if (confirm(`אזהרה: האם למחוק את חדר "${roomId}" ואת כל ההודעות שבו?`)) {
        db.ref(`chats/${roomId}`).remove()
          .then(() => {
            activeRoomId = null;
            document.getElementById("selectedRoomTitle").innerText = "בחר חדר לצפייה";
            document.getElementById("selectedRoomInfo").innerText = "יש לבחור חדר מרשימת החדרים מימין";
            document.getElementById("deleteRoomBtn").classList.add("hidden");
            document.getElementById("messagesContainer").innerHTML = `<div class="text-center text-slate-400 py-20 text-sm">טרם נבחר חדר</div>`;
          })
          .catch((err) => alert("שגיאה במחיקת החדר: " + err.message));
      }
    }

    // מודאל עריכה
    function openEditModal(msgKey, currentText) {
      editingMsgKey = msgKey;
      document.getElementById("editInput").value = currentText;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      editingMsgKey = null;
      document.getElementById("editModal").classList.add("hidden");
    }

    document.getElementById("saveEditBtn").onclick = () => {
      const newText = document.getElementById("editInput").value.trim();
      if (!newText || !activeRoomId || !editingMsgKey) return;

      db.ref(`chats/${activeRoomId}/${editingMsgKey}/text`).set(newText)
        .then(() => {
          closeEditModal();
        })
        .catch((err) => alert("שגיאה בעדכון ההודעה: " + err.message));
    };

    // עוזרי אבטחה וטקסט
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsString(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
    }

    // הפעלה ראשונית
    loadAllData();
  </script>
</body>
</html>
