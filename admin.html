
<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פאנל ניהול - צ'אט מתורגם</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 dark:bg-gray-900 min-h-screen text-slate-800 dark:text-gray-100 p-4 sm:p-6 transition-colors duration-200">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-colors">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <span>🛠️</span> פאנל ניהול שיחות
        </h1>
        <p class="text-sm text-slate-500 dark:text-gray-400 mt-1">צפייה, נעילה, הוספה ומחיקה של חדרים והודעות בזמן אמת</p>
      </div>
      <div class="flex items-center gap-3">
        <!-- מתג מצב לילה / יום -->
        <button id="themeToggleBtn" class="p-2.5 rounded-xl bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-200 hover:opacity-80 transition text-sm flex items-center gap-1.5 font-medium">
          <span id="themeIcon">🌙</span>
          <span id="themeText">מצב לילה</span>
        </button>

        <span id="connectionStatus" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          מתחבר...
        </span>
        <button onclick="loadAllData()" class="bg-slate-100 dark:bg-gray-700 hover:bg-slate-200 dark:hover:bg-gray-600 text-slate-700 dark:text-gray-200 px-3 py-2 rounded-xl text-xs font-semibold transition">
          🔄 רענן
        </button>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- רשימת חדרים -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-gray-700 flex flex-col h-[75vh] transition-colors">
        <h2 class="font-bold text-lg mb-3 flex justify-between items-center text-slate-800 dark:text-white">
          <span>רשימת חדרים</span>
          <span id="roomCount" class="bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div id="roomsList" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <div class="text-center text-slate-400 dark:text-gray-500 py-10 text-sm">טוען חדרים...</div>
        </div>
      </div>

      <!-- תצוגת ההודעות בחדר הנבחר -->
      <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-gray-700 flex flex-col h-[75vh] transition-colors">
        
        <!-- כותרת החדר הנבחר ופעולות ניהול -->
        <div class="border-b border-slate-100 dark:border-gray-700 pb-4 mb-3 flex justify-between items-center flex-wrap gap-2">
          <div>
            <h3 id="selectedRoomTitle" class="font-bold text-xl text-slate-900 dark:text-white">בחר חדר לצפייה</h3>
            <span id="selectedRoomInfo" class="text-xs text-slate-400 dark:text-gray-500">יש לבחור חדר מרשימת החדרים מימין</span>
          </div>
          
          <div class="flex items-center gap-2">
            <!-- כפתור נעילה / שחרור חדר למנהל -->
            <button id="toggleLockRoomBtn" class="hidden px-3 py-1.5 rounded-xl text-xs font-semibold border transition items-center gap-1.5 active:scale-95">
              <span id="lockBtnIcon">🔓</span>
              <span id="lockBtnText">פתוח</span>
            </button>

            <!-- כפתור מחיקת חדר -->
            <button id="deleteRoomBtn" class="hidden bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 px-3 py-1.5 rounded-xl text-xs font-semibold transition items-center gap-1">
              🗑️ מחק חדר
            </button>
          </div>
        </div>

        <!-- אזור הצגת ההודעות -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto space-y-3 p-3 bg-slate-50/50 dark:bg-gray-900/50 rounded-xl border border-slate-100 dark:border-gray-700/50">
          <div class="text-center text-slate-400 dark:text-gray-500 py-20 text-sm">טרם נבחר חדר</div>
        </div>

        <!-- אזור הוספת הודעת מנהל -->
        <form id="adminMessageForm" class="hidden mt-3 pt-3 border-t border-slate-100 dark:border-gray-700 flex gap-2">
          <input type="text" id="adminInput" placeholder="הוסף הודעה כ-מנהל מערכת..." class="flex-1 bg-slate-100 dark:bg-gray-700 border-0 rounded-xl px-4 py-2.5 text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center gap-1">
            <span>➕</span>
            <span>שלח</span>
          </button>
        </form>

      </div>
    </div>
  </div>

  <!-- Modal לעריכת הודעה -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-gray-700 space-y-4">
      <h3 class="font-bold text-lg text-slate-800 dark:text-white">עריכת הודעה</h3>
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-gray-400 mb-1">תוכן ההודעה המעודכן</label>
        <textarea id="editInput" rows="4" class="w-full bg-slate-50 dark:bg-gray-700 border border-slate-200 dark:border-gray-600 rounded-xl p-3 text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 dark:bg-gray-700 hover:bg-slate-200 dark:hover:bg-gray-600 text-slate-700 dark:text-gray-200 rounded-xl text-xs font-semibold transition">ביטול</button>
        <button id="saveEditBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition">שמור שינויים</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeRoomId = null;
    let editingMsgKey = null;
    let isCurrentRoomLocked = false;

    // --- ניהול Dark Mode / Light Mode ---
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeText').innerText = isDark ? 'מצב יום' : 'מצב לילה';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').innerText = '☀️';
      document.getElementById('themeText').innerText = 'מצב יום';
    }

    document.getElementById('themeToggleBtn').addEventListener('click', toggleDarkMode);

    // מעקב אחר חיבור ל-Firebase
    db.ref(".info/connected").on("value", (snap) => {
      const statusEl = document.getElementById("connectionStatus");
      if (snap.val() === true) {
        statusEl.className = "inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300";
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> מחובר`;
      } else {
        statusEl.className = "inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300";
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> מנותק`;
      }
    });

    // טעינת כל הנתונים בזמן אמת
    function loadAllData() {
      db.ref("chats").on("value", (snapshot) => {
        const roomsList = document.getElementById("roomsList");
        const roomsData = snapshot.val();

        if (!roomsData) {
          roomsList.innerHTML = `<div class="text-center text-slate-400 dark:text-gray-500 py-10 text-sm">אין חדרים קיימים במערכת</div>`;
          document.getElementById("roomCount").innerText = "0";
          return;
        }

        const roomKeys = Object.keys(roomsData);
        document.getElementById("roomCount").innerText = roomKeys.length;
        roomsList.innerHTML = "";

        roomKeys.forEach((roomId) => {
          const roomObj = roomsData[roomId] || {};
          const messagesObj = roomObj.messages || {};
          const msgCount = Object.keys(messagesObj).length;

          const presenceObj = roomObj.presence || {};
          const usersCount = Object.keys(presenceObj).length;

          const isLocked = roomObj.settings && roomObj.settings.isLocked;
          const isSelected = roomId === activeRoomId;

          const btn = document.createElement("button");
          btn.className = `w-full text-right p-3 rounded-xl transition flex justify-between items-center border ${
            isSelected 
              ? 'bg-indigo-50 border-indigo-200 dark:bg-indigo-900/40 dark:border-indigo-700 text-indigo-900 dark:text-indigo-200 font-bold' 
              : 'bg-white hover:bg-slate-50 dark:bg-gray-800 dark:hover:bg-gray-700 border-slate-100 dark:border-gray-700 text-slate-700 dark:text-gray-200'
          }`;
          btn.onclick = () => selectRoom(roomId);

          const lockBadge = isLocked ? '🔒' : '💬';
          btn.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span>${lockBadge}</span>
              <span class="truncate">${roomId}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 px-1.5 py-0.5 rounded-md font-normal">👥 ${usersCount}</span>
              <span class="text-xs bg-slate-100 dark:bg-gray-700 px-2 py-1 rounded-md text-slate-500 dark:text-gray-400 font-normal">${msgCount} הודעות</span>
            </div>
          `;
          roomsList.appendChild(btn);
        });

        if (activeRoomId && roomsData[activeRoomId]) {
          renderRoomContent(activeRoomId, roomsData[activeRoomId]);
        }
      });
    }

    // בחירת חדר
    function selectRoom(roomId) {
      activeRoomId = roomId;
      db.ref(`chats/${roomId}`).once('value', (snap) => {
        renderRoomContent(roomId, snap.val() || {});
      });
    }

    // הצגת תוכן החדר הנבחר (הודעות + הגדרות)
    function renderRoomContent(roomId, roomObj) {
      document.getElementById("selectedRoomTitle").innerText = `חדר: ${roomId}`;

      // כפתור מחיקה
      const deleteRoomBtn = document.getElementById("deleteRoomBtn");
      deleteRoomBtn.classList.remove("hidden");
      deleteRoomBtn.classList.add("flex");
      deleteRoomBtn.onclick = () => deleteRoom(roomId);

      // טופס שליחת הודעת מנהל
      const adminForm = document.getElementById("adminMessageForm");
      adminForm.classList.remove("hidden");

      // נעילה/שחרור
      const toggleLockBtn = document.getElementById("toggleLockRoomBtn");
      const lockBtnIcon = document.getElementById("lockBtnIcon");
      const lockBtnText = document.getElementById("lockBtnText");
      
      toggleLockBtn.classList.remove("hidden");
      toggleLockBtn.classList.add("flex");

      const isLocked = roomObj.settings && roomObj.settings.isLocked;
      isCurrentRoomLocked = !!isLocked;

      if (isLocked) {
        lockBtnIcon.innerText = '🔒';
        lockBtnText.innerText = 'נעול';
        toggleLockBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200 border border-amber-300 dark:border-amber-700 transition active:scale-95";
      } else {
        lockBtnIcon.innerText = '🔓';
        lockBtnText.innerText = 'פתוח';
        toggleLockBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-gray-700 dark:text-gray-200 border border-slate-200 dark:border-gray-600 transition active:scale-95";
      }

      toggleLockBtn.onclick = () => toggleRoomLock(roomId);

      // הצגת הודעות
      renderMessages(roomObj.messages || {});
    }

    // נעילה / שחרור חדר ע"י המנהל
    function toggleRoomLock(roomId) {
      const newLockState = !isCurrentRoomLocked;
      const updates = { isLocked: newLockState };

      if (!newLockState) {
        updates.unlockedManually = true;
      }

      db.ref(`chats/${roomId}/settings`).update(updates);
    }

    // הצגת ההודעות של החדר הנבחר
    function renderMessages(messagesData) {
      const container = document.getElementById("messagesContainer");
      container.innerHTML = "";

      const keys = Object.keys(messagesData);
      
      if (keys.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 dark:text-gray-500 py-20 text-sm">אין הודעות בחדר זה</div>`;
        document.getElementById("selectedRoomInfo").innerText = "0 הודעות";
        return;
      }

      document.getElementById("selectedRoomInfo").innerText = `${keys.length} הודעות בזמן אמת`;

      keys.forEach((msgKey) => {
        const msg = messagesData[msgKey];
        const dateStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';

        const card = document.createElement("div");
        card.className = "bg-white dark:bg-gray-800 p-3.5 rounded-xl border border-slate-200 dark:border-gray-700 shadow-sm flex flex-col gap-2 relative group transition-colors";

        const imageHtml = msg.image 
          ? `<div class="mt-1">
              <a href="${msg.image}" target="_blank" title="לחץ להגדלה">
                <img src="${msg.image}" class="rounded-lg max-h-48 max-w-full object-cover border border-slate-200 dark:border-gray-700 hover:opacity-90 transition">
              </a>
            </div>` 
          : '';

        const textHtml = msg.text ? `<div class="text-slate-800 dark:text-gray-100 text-sm break-words">${escapeHtml(msg.text)}</div>` : '';
        const senderBadge = msg.sender === 'מנהל מערכת' 
          ? `<span class="font-bold bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300 px-1.5 py-0.5 rounded text-[10px]">👑 מנהל מערכת</span>`
          : `<span class="font-mono bg-slate-100 dark:bg-gray-700 px-1.5 py-0.5 rounded text-[10px] text-slate-600 dark:text-gray-300">${msg.sender || 'אנונימי'}</span>`;

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs text-slate-400 dark:text-gray-500 border-b border-slate-50 dark:border-gray-700 pb-1.5">
            ${senderBadge}
            <span>${dateStr}</span>
          </div>
          ${imageHtml}
          ${textHtml}
          <div class="flex justify-end gap-3 pt-1 border-t border-slate-50 dark:border-gray-700">
            <button onclick="openEditModal('${msgKey}', \`${escapeJsString(msg.text || '')}\`)" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline font-semibold transition">
              ✏️ ערוך
            </button>
            <button onclick="deleteMessage('${msgKey}')" class="text-xs text-red-500 dark:text-red-400 hover:underline font-semibold transition">
              🗑️ מחק
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      container.scrollTop = container.scrollHeight;
    }

    // הוספת הודעת מנהל לחדר
    document.getElementById("adminMessageForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("adminInput");
      const text = input.value.trim();

      if (!text || !activeRoomId) return;

      db.ref(`chats/${activeRoomId}/messages`).push({
        sender: "מנהל מערכת",
        text: text,
        timestamp: Date.now()
      }).then(() => {
        input.value = "";
      });
    });

    // מחיקת הודעה בודדת
    function deleteMessage(msgKey) {
      if (!activeRoomId) return;
      if (confirm("האם אתה בטוח שברצונך למחוק הודעה זו?")) {
        db.ref(`chats/${activeRoomId}/messages/${msgKey}`).remove();
      }
    }

    // מחיקת חדר לחלוטין
    function deleteRoom(roomId) {
      if (confirm(`אזהרה: האם למחוק את חדר "${roomId}" ואת כל ההודעות שבו?`)) {
        db.ref(`chats/${roomId}`).remove()
          .then(() => {
            activeRoomId = null;
            document.getElementById("selectedRoomTitle").innerText = "בחר חדר לצפייה";
            document.getElementById("selectedRoomInfo").innerText = "יש לבחור חדר מרשימת החדרים מימין";
            document.getElementById("deleteRoomBtn").classList.add("hidden");
            document.getElementById("toggleLockRoomBtn").classList.add("hidden");
            document.getElementById("adminMessageForm").classList.add("hidden");
            document.getElementById("messagesContainer").innerHTML = `<div class="text-center text-slate-400 dark:text-gray-500 py-20 text-sm">טרם נבחר חדר</div>`;
          });
      }
    }

    // מודאל עריכת הודעה
    function openEditModal(msgKey, currentText) {
      editingMsgKey = msgKey;
      document.getElementById("editInput").value = currentText;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      editingMsgKey = null;
      document.getElementById("editModal").classList.add("hidden");
    }

    document.getElementById("saveEditBtn").onclick = () => {
      const newText = document.getElementById("editInput").value.trim();
      if (!activeRoomId || !editingMsgKey) return;

      db.ref(`chats/${activeRoomId}/messages/${editingMsgKey}/text`).set(newText)
        .then(() => closeEditModal());
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsString(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
    }

    loadAllData();
  </script>
</body>
</html>
