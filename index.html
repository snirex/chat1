<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>צ'אט מתורגם בזמן אמת</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-msg { animation: fadeIn 0.2s ease-out forwards; }

    /* אנימציות מעבר בין מסכים */
    .screen-enter {
      animation: screenIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .screen-exit {
      animation: screenOut 0.25s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes screenOut {
      from { opacity: 1; transform: scale(1) translateY(0); }
      to { opacity: 0; transform: scale(0.96) translateY(-8px); }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-full flex flex-col transition-colors overflow-x-hidden">

  <!-- מסך כניסה -->
  <div id="roomSelectionScreen" class="fixed inset-0 z-50 bg-gray-100 dark:bg-gray-900 flex flex-col justify-center items-center p-4 screen-enter">
    <div class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-100 dark:border-gray-700 space-y-5 my-auto">

      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent">צ'אט מתורגם</h1>
        <div class="flex items-center gap-2">
          <!-- חיווי חיבור במסך ראשי -->
          <span class="connectionStatus inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            מתחבר...
          </span>
          <button id="themeToggleLogin" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700">🌙</button>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-500 dark:text-gray-400">השפה שלי</label>
          <select id="userLanguage" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="he">עברית (Hebrew)</option>
            <option value="en">אנגלית (English)</option>
            <option value="es">ספרדית (Spanish)</option>
            <option value="fr">צרפתית (French)</option>
            <option value="ru">רוסית (Russian)</option>
            <option value="ar">ערבית (Arabic)</option>
            <option value="si">סינהלית (Sinhala - סרי לנקה)</option>
            <option value="ta">טמילית (Tamil - סרי לנקה)</option>
            <option value="sw">סוואהילית (Swahili)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-gray-500 dark:text-gray-400">קוד חדר</label>
          <input type="text" id="roomCodeInput" placeholder="למשל: 123" value="" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-bold" dir="ltr">
        </div>

        <!-- רשימת חדרים פעילים -->
        <div>
          <label class="block text-xs font-semibold mb-2 text-gray-500 dark:text-gray-400">חדרים פעילים ברשת</label>
          <div id="activeRoomsList" class="flex flex-wrap gap-2 max-h-28 overflow-y-auto p-1">
            <span class="text-xs text-gray-400 italic">טוען חדרים...</span>
          </div>
        </div>

        <button id="joinRoomBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg active:scale-95 transition">
          היכנס לחדר
        </button>
      </div>
    </div>

    <footer class="py-4 text-center text-xs text-gray-500 dark:text-gray-400 space-y-1">
      <p>
        בנוי על ידי <span class="font-bold text-indigo-600 dark:text-indigo-400">שניר אלגבסי</span> © 2026
      </p>
      <p>
        This chat was made by <span class="font-bold text-indigo-600 dark:text-indigo-400">Snir Elgabsi</span> © 2026
      </p>
      <div class="flex justify-center gap-3 text-[11px] text-gray-400 dark:text-gray-500">
        <a href="https://github.com/snirex" target="_blank" class="hover:text-indigo-500 transition font-medium">GitHub</a>
        <span>•</span>
        <a href="https://www.linkedin.com/in/snir-elgabsi" target="_blank" class="hover:text-indigo-500 transition font-medium">LinkedIn</a>
        <span>•</span>
        <a href="mailto:elsnir@gmail.com" class="hover:text-indigo-500 transition font-medium">צור קשר</a>
      </div>
    </footer>
  </div>

  <!-- מסך צ'אט -->
  <div id="chatScreen" class="hidden flex-col h-full max-w-2xl w-full mx-auto bg-white dark:bg-gray-800 shadow-2xl relative">

    <header class="p-3 bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b border-gray-200 dark:border-gray-700 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <!-- כפתור יציאה מחדר מעוצב -->
        <button id="leaveRoomBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30 dark:hover:text-red-400 font-medium text-xs transition active:scale-95">
          <span>➡️</span>
          <span>יציאה</span>
        </button>

        <div>
          <div class="flex items-center gap-2">
            <h2 id="currentRoomTitle" class="font-bold text-sm">חדר: ---</h2>
            <!-- תג כמות משתמשים בצ'אט -->
            <span id="roomUsersBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-indigo-50 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-800">
              👥 0
            </span>
          </div>
          <span id="currentLangBadge" class="text-[10px] text-gray-400 block">שפה: עברית</span>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- כפתור נעילה / שחרור של החדר -->
        <button id="toggleLockBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition active:scale-95">
          <span id="lockBtnIcon">🔓</span>
          <span id="lockBtnText">פתוח</span>
        </button>

        <!-- חיווי חיבור במסך צ'אט -->
        <span class="connectionStatus inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          מתחבר...
        </span>
        <button id="themeToggleChat" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700">🌙</button>
      </div>
    </header>

    <main id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 dark:bg-gray-900/40">
      <!-- הודעות -->
    </main>

    <!-- אזור תצוגה מקדימה לתמונה לפני שליחה -->
    <div id="imagePreviewContainer" class="hidden px-4 py-2 bg-gray-100 dark:bg-gray-700 border-t border-gray-200 dark:border-gray-600 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded-lg border">
        <span class="text-xs text-gray-500 dark:text-gray-300">תמונה מוכנה לשליחה</span>
      </div>
      <button id="cancelImageBtn" class="text-xs text-red-500 hover:underline">בטל</button>
    </div>

    <footer class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 sticky bottom-0">
      <form id="messageForm" class="flex items-center gap-2">

        <!-- כפתור העלאת תמונה -->
        <label for="imageInput" class="p-3 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-2xl cursor-pointer text-gray-600 dark:text-gray-300 transition flex items-center justify-center">
          📷
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <input type="text" id="messageInput" placeholder="הקלד הודעה..." class="flex-1 bg-gray-100 dark:bg-gray-700 border-0 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">

        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-2xl font-semibold active:scale-95 transition">
          <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        </button>
      </form>
    </footer>
  </div>

  <footer class="py-4 text-center text-xs text-gray-500 dark:text-gray-400 space-y-1">
    <p>
      בנוי על ידי <span class="font-bold text-indigo-600 dark:text-indigo-400">שניר אלגבסי</span> © 2026
    </p>
    <p>
      This chat was made by <span class="font-bold text-indigo-600 dark:text-indigo-400">Snir Elgabsi</span> © 2026
    </p>
    <div class="flex justify-center gap-3 text-[11px] text-gray-400 dark:text-gray-500">
      <a href="https://github.com/snirex" target="_blank" class="hover:text-indigo-500 transition font-medium">GitHub</a>
      <span>•</span>
      <a href="https://www.linkedin.com/in/snir-elgabsi" target="_blank" class="hover:text-indigo-500 transition font-medium">LinkedIn</a>
      <span>•</span>
      <a href="mailto:elsnir@gmail.com" class="hover:text-indigo-500 transition font-medium">צור קשר</a>
    </div>
  </footer>

  <script>
    const firebaseConfig = {
      databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app"  
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // חיווי סטטוס חיבור בזמן אמת מול Firebase
    db.ref(".info/connected").on("value", (snap) => {
      const statusEls = document.querySelectorAll(".connectionStatus");
      statusEls.forEach(statusEl => {
        if (snap.val() === true) {
          statusEl.className = "connectionStatus inline-flex items-center gap-1.5 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300";
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> מחובר`;
        } else {
          statusEl.className = "connectionStatus inline-flex items-center gap-1.5 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300";
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> מנותק`;
        }
      });
    });

    const userId = "user_" + Math.random().toString(36).substr(2, 7);
    let currentRoomRef = null;
    let currentRoomId = null;
    let userPresenceRef = null;
    let myLanguage = "he";
    let selectedImageBase64 = null;
    let isCurrentRoomLocked = false;
    let activeUsersCount = 0;

    const roomSelectionScreen = document.getElementById('roomSelectionScreen');
    const chatScreen = document.getElementById('chatScreen');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const activeRoomsList = document.getElementById('activeRoomsList');
    const userLanguageSelect = document.getElementById('userLanguage');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const toggleLockBtn = document.getElementById('toggleLockBtn');
    const lockBtnIcon = document.getElementById('lockBtnIcon');
    const lockBtnText = document.getElementById('lockBtnText');
    const currentRoomTitle = document.getElementById('currentRoomTitle');
    const roomUsersBadge = document.getElementById('roomUsersBadge');
    const currentLangBadge = document.getElementById('currentLangBadge');
    const chatBox = document.getElementById('chatBox');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const cancelImageBtn = document.getElementById('cancelImageBtn');

    // טעינה והצגה של חדרים פעילים ברשת כולל ספירת משתמשים בכל חדר
    db.ref('chats').on('value', (snapshot) => {
      activeRoomsList.innerHTML = '';
      const chats = snapshot.val();

      if (!chats) {
        activeRoomsList.innerHTML = `<span class="text-xs text-gray-400 italic">אין חדרים פעילים כרגע</span>`;
        return;
      }

      const roomKeys = Object.keys(chats);
      let countActiveRooms = 0;

      roomKeys.forEach(roomKey => {
        const roomData = chats[roomKey];
        const presence = roomData.presence || {};
        const usersCount = Object.keys(presence).length;

        // מציגים ברשימה רק חדרים עם נוכחות משתמשים או הודעות
        const isLocked = roomData.settings && roomData.settings.isLocked;
        countActiveRooms++;

        const roomBtn = document.createElement('button');
        roomBtn.type = 'button';
        roomBtn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border transition flex items-center gap-1.5 active:scale-95 ${
          isLocked 
            ? 'bg-amber-50 dark:bg-amber-900/20 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800' 
            : 'bg-gray-100 dark:bg-gray-700 hover:bg-indigo-50 dark:hover:bg-indigo-900/40 text-gray-700 dark:text-gray-200 border-gray-200 dark:border-gray-600'
        }`;
        
        const lockIcon = isLocked ? '🔒' : '<span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>';
        const usersBadgeHtml = `<span class="text-[10px] opacity-75 font-normal">(${usersCount})</span>`;
        
        roomBtn.innerHTML = `${lockIcon} <span>#${roomKey}</span> ${usersBadgeHtml}`;
        
        roomBtn.addEventListener('click', () => {
          roomCodeInput.value = roomKey;
        });

        activeRoomsList.appendChild(roomBtn);
      });

      if (countActiveRooms === 0) {
        activeRoomsList.innerHTML = `<span class="text-xs text-gray-400 italic">אין חדרים פעילים כרגע</span>`;
      }
    });

    // Theme Toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeToggleLogin').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeToggleChat').innerText = isDark ? '☀️' : '🌙';
    }
    document.getElementById('themeToggleLogin').addEventListener('click', toggleDarkMode);
    document.getElementById('themeToggleChat').addEventListener('click', toggleDarkMode);

    // טיפול בבחירת תמונה וכיווצה
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
          imagePreview.src = selectedImageBase64;
          imagePreviewContainer.classList.remove('hidden');
          imagePreviewContainer.classList.add('flex');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    cancelImageBtn.addEventListener('click', () => {
      selectedImageBase64 = null;
      imageInput.value = '';
      imagePreviewContainer.classList.add('hidden');
      imagePreviewContainer.classList.remove('flex');
    });

    // תרגום ברקע
    async function translateText(text, targetLang) {
      if (!text) return '';
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
      } catch (err) {
        return text;
      }
    }

    // פונקציות מעבר באנימציה
    function navigateToChat() {
      roomSelectionScreen.classList.add('screen-exit');
      
      setTimeout(() => {
        roomSelectionScreen.classList.add('hidden');
        roomSelectionScreen.classList.remove('screen-exit');

        chatScreen.classList.remove('hidden');
        chatScreen.classList.add('flex', 'screen-enter');

        setTimeout(() => chatScreen.classList.remove('screen-enter'), 350);
      }, 200);
    }

    function navigateToHome() {
      chatScreen.classList.add('screen-exit');

      setTimeout(() => {
        chatScreen.classList.add('hidden');
        chatScreen.classList.remove('flex', 'screen-exit');

        roomSelectionScreen.classList.remove('hidden');
        roomSelectionScreen.classList.add('screen-enter');

        setTimeout(() => roomSelectionScreen.classList.remove('screen-enter'), 350);
      }, 200);
    }

    // עדכון תצוגת כפתור הנעילה
    function updateLockButtonUI(isLocked) {
      isCurrentRoomLocked = isLocked;
      if (isLocked) {
        lockBtnIcon.innerText = '🔒';
        lockBtnText.innerText = 'נעול';
        toggleLockBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200 hover:bg-amber-200 transition active:scale-95";
      } else {
        lockBtnIcon.innerText = '🔓';
        lockBtnText.innerText = 'פתוח';
        toggleLockBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition active:scale-95";
      }
    }

    // כניסה לחדר
    joinRoomBtn.addEventListener('click', async () => {
      const rawRoomCode = roomCodeInput.value.trim().toLowerCase();
      if (!rawRoomCode) return alert('נא להזין קוד חדר');

      const roomId = rawRoomCode.replace(/[^a-z0-9_-]/g, '');
      
      // בדיקה בשרת האם החדר נעול לפני הכניסה
      const roomSettingsSnap = await db.ref(`chats/${roomId}/settings`).once('value');
      const settings = roomSettingsSnap.val() || {};

      if (settings.isLocked) {
        return alert('החדר נעול לכניסת משתמשים נוספים על ידי יושבי החדר.');
      }

      myLanguage = userLanguageSelect.value;
      currentRoomId = roomId;

      currentRoomTitle.innerText = `חדר: ${roomId}`;
      currentLangBadge.innerText = `שפה: ${userLanguageSelect.options[userLanguageSelect.selectedIndex].text.split(' ')[0]}`;

      navigateToChat();

      chatBox.innerHTML = '';
      currentRoomRef = db.ref(`chats/${roomId}`);

      // 1. רישום נוכחות המשתמש בחדר
      userPresenceRef = db.ref(`chats/${roomId}/presence/${userId}`);
      userPresenceRef.set(true);
      userPresenceRef.onDisconnect().remove();

      // 2. מעקב נוכחות וספירת משתמשים
      db.ref(`chats/${roomId}/presence`).on('value', (presenceSnap) => {
        activeUsersCount = presenceSnap.numChildren();
        
        // עדכון תג כמות המשתמשים ב-Header של הצ'אט
        roomUsersBadge.innerText = `👥 ${activeUsersCount}`;

        db.ref(`chats/${roomId}/settings`).once('value', (settingsSnap) => {
          const roomSettings = settingsSnap.val() || {};
          // נעילה אוטומטית בהגעה ל-2 משתמשים (אם החדר לא שוחרר ידנית בעבר ולא נעול כבר)
          if (activeUsersCount >= 2 && !roomSettings.unlockedManually && !roomSettings.isLocked) {
            db.ref(`chats/${roomId}/settings`).update({ isLocked: true });
          }
        });
      });

      // 3. האזנה לשינויים בהגדרות החדר (נעילה/שחרור)
      db.ref(`chats/${roomId}/settings`).on('value', (settingsSnap) => {
        const roomSettings = settingsSnap.val() || {};
        updateLockButtonUI(!!roomSettings.isLocked);
      });

      // 4. טעינת הודעות
      currentRoomRef.child('messages').limitToLast(50).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        const msgKey = snapshot.key;
        const isMe = msg.sender === userId;

        appendMessageElement(msgKey, isMe ? msg.text : "מתרגם...", msg.text, msg.image, isMe);

        if (!isMe && msg.text) {
          translateText(msg.text, myLanguage).then(translated => {
            updateMessageText(msgKey, translated);
          });
        }
      });
    });

    // לחיצה על כפתור נעילה / שחרור ידני
    toggleLockBtn.addEventListener('click', () => {
      if (!currentRoomId) return;

      const newLockState = !isCurrentRoomLocked;

      // בדיקה: לא מאפשרים לנעול חדר אם יש רק משתמש יחיד בחדר
      if (newLockState && activeUsersCount <= 1) {
        return alert('לא ניתן לנעול חדר שיש בו משתמש אחד בלבד.');
      }

      const updates = { isLocked: newLockState };

      // אם פותחים את החדר ידנית, מסמנים שלא יינעל שוב אוטומטית בהצטרפות אחרים
      if (!newLockState) {
        updates.unlockedManually = true;
      }

      db.ref(`chats/${currentRoomId}/settings`).update(updates);
    });

    // יציאה מחדר
    leaveRoomBtn.addEventListener('click', () => {
      if (userPresenceRef) {
        userPresenceRef.remove();
        userPresenceRef = null;
      }
      if (currentRoomId) {
        db.ref(`chats/${currentRoomId}/presence`).off();
        db.ref(`chats/${currentRoomId}/settings`).off();
        db.ref(`chats/${currentRoomId}/messages`).off();
      }

      currentRoomId = null;
      currentRoomRef = null;
      activeUsersCount = 0;
      navigateToHome();
    });

    // שליחת הודעה
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();

      if ((!text && !selectedImageBase64) || !currentRoomRef) return;

      currentRoomRef.child('messages').push({
        sender: userId,
        text: text || "",
        image: selectedImageBase64 || null,
        timestamp: Date.now()
      });

      messageInput.value = '';
      cancelImageBtn.click();
    });

    // יצירת אלמנט הודעה בצ'אט
    function appendMessageElement(key, textToShow, originalText, imageUrl, isMe) {
      const wrapper = document.createElement('div');
      wrapper.id = `msg-${key}`;
      wrapper.className = `flex flex-col ${isMe ? 'items-start' : 'items-end'} animate-msg`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] sm:max-w-[70%] p-3.5 rounded-2xl shadow-sm text-sm ${
        isMe 
          ? 'bg-indigo-600 text-white rounded-br-none' 
          : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-100 dark:border-gray-700 rounded-bl-none'
      }`;

      let imgHtml = imageUrl ? `<a href="${imageUrl}" target="_blank"><img src="${imageUrl}" class="rounded-xl mb-2 max-h-60 w-full object-cover shadow-sm hover:opacity-95 transition"></a>` : '';
      let textHtml = textToShow ? `<div class="msg-content break-words">${textToShow}</div>` : '';
      let subText = (!isMe && originalText) ? `<div class="text-[10px] opacity-60 mt-1.5 pt-1 border-t border-gray-200/30">מקור: ${originalText}</div>` : '';

      msgDiv.innerHTML = `${imgHtml}${textHtml}${subText}`;
      wrapper.appendChild(msgDiv);
      chatBox.appendChild(wrapper);

      chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    function updateMessageText(key, newText) {
      const wrapper = document.getElementById(`msg-${key}`);
      if (wrapper) {
        const contentDiv = wrapper.querySelector('.msg-content');
        if (contentDiv) contentDiv.innerText = newText;
      }
    }
  </script>
</body>
</html>
