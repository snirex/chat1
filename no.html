<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט בין שפות</title>

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
        }
        .chat-container {
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            background: #ffffff;
            overflow: hidden;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background-color: #f8f9fa;
        }
        .message-bubble {
            max-width: 75%;
            padding: 0.75rem 1rem;
            border-radius: 15px;
            margin-bottom: 1rem;
            position: relative;
            word-wrap: break-word;
        }
        .message-user {
            background-color: #0d6efd;
            color: #ffffff;
            border-bottom-left-radius: 2px;
            margin-left: auto;
        }
        .message-other {
            background-color: #e9ecef;
            color: #212529;
            border-bottom-right-radius: 2px;
            margin-right: auto;
        }
        .translation-text {
            font-size: 0.85rem;
            opacity: 0.85;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 6px;
            padding-top: 4px;
        }
        .message-other .translation-text {
            border-top-color: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" x-data="chatApp()">

    <div class="container chat-container p-0 my-auto">
        
        <!-- Header -->
        <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="fa-solid font-size-4 fa-language fs-3"></i>
                <h5 class="m-0 fw-bold">צ'אט תרגום בזמן אמת</h5>
            </div>
            
            <!-- Controls Header -->
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm" x-model="userLanguage" style="width: 130px;">
                    <template x-for="lang in languages" :key="lang.code">
                        <option :value="lang.code" x-text="lang.name"></option>
                    </template>
                </select>
                <button class="btn btn-outline-light btn-sm" @click="clearMessages()" title="נקה היסטוריה">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-messages" id="chatArea">
            <template x-if="messages.length === 0">
                <div class="text-center text-muted my-5">
                    <i class="fa-solid fa-comments fs-1 mb-3"></i>
                    <p>אין עדיין הודעות. התחל להקליד כדי לתרגם בזמן אמת!</p>
                </div>
            </template>

            <template x-for="(msg, index) in messages" :key="index">
                <div class="d-flex flex-column" :class="msg.isUser ? 'align-items-end' : 'align-items-start'">
                    <div class="message-bubble" :class="msg.isUser ? 'message-user' : 'message-other'">
                        <!-- Send Info -->
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-1">
                            <strong class="small" x-text="msg.sender"></strong>
                            <span class="badge rounded-pill bg-light text-dark" style="font-size: 0.65rem;" x-text="getLangName(msg.sourceLang)"></span>
                        </div>

                        <!-- Original Message -->
                        <div class="fw-normal" x-text="msg.originalText"></div>

                        <!-- Translated Message -->
                        <div class="translation-text" x-show="msg.translatedText">
                            <i class="fa-solid fa-globe me-1"></i>
                            <span x-text="msg.translatedText"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-top">
            <form @submit.prevent="sendMessage()">
                <div class="row g-2 align-items-center">
                    <!-- Sender Toggle -->
                    <div class="col-auto">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" 
                                    :class="{ 'active': isUserSender }" 
                                    @click="isUserSender = true">אני</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" 
                                    :class="{ 'active': !isUserSender }" 
                                    @click="isUserSender = false">הצד השני</button>
                        </div>
                    </div>

                    <!-- Target Language Selection -->
                    <div class="col-auto">
                        <select class="form-select form-select-sm" x-model="targetLanguage" style="width: 120px;">
                            <template x-for="lang in languages" :key="lang.code">
                                <option :value="lang.code" x-text="'ל-' + lang.name"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Input Box -->
                    <div class="col">
                        <input type="text" class="form-control" placeholder="הקלד הודעה..." x-model="newMessageText" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
                            <span>שלח</span>
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

    </div>

    <!-- Alpine.js JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('chatApp', () => ({
                userLanguage: 'he',
                targetLanguage: 'en',
                newMessageText: '',
                isUserSender: true,
                
                languages: [
                    { code: 'he', name: 'עברית' },
                    { code: 'en', name: 'אנגלית' },
                    { code: 'es', name: 'ספרדית' },
                    { code: 'fr', name: 'צרפתית' },
                    { code: 'ru', name: 'רוסית' },
                    { code: 'ar', name: 'ערבית' }
                ],

                messages: JSON.parse(localStorage.getItem('chat_messages') || '[]'),

                init() {
                    this.$watch('messages', value => {
                        localStorage.setItem('chat_messages', JSON.stringify(value));
                        this.scrollToBottom();
                    });
                    this.scrollToBottom();
                },

                async sendMessage() {
                    if (!this.newMessageText.trim()) return;

                    const original = this.newMessageText;
                    const srcLang = this.isUserSender ? this.userLanguage : this.targetLanguage;
                    const destLang = this.isUserSender ? this.targetLanguage : this.userLanguage;

                    const translated = await this.translateText(original, srcLang, destLang);

                    this.messages.push({
                        sender: this.isUserSender ? 'משתמש' : 'משתתף מרוחק',
                        isUser: this.isUserSender,
                        originalText: original,
                        translatedText: translated,
                        sourceLang: srcLang,
                        targetLang: destLang,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });

                    this.newMessageText = '';
                },

                async translateText(text, fromLang, toLang) {
                    if (fromLang === toLang) return text;
                    try {
                        // MyMemory Free Translation API
                        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`);
                        const data = await response.json();
                        return data.responseData.translatedText || text;
                    } catch (error) {
                        console.error("Translation Error:", error);
                        return text; // Fallback to original text on error
                    }
                },

                getLangName(code) {
                    const lang = this.languages.find(l => l.code === code);
                    return lang ? lang.name : code;
                },

                clearMessages() {
                    if (confirm('האם למחוק את היסטוריית ההודעות?')) {
                        this.messages = [];
                    }
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = document.getElementById('chatArea');
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    });
                }
            }));
        });
    </script>
</body>
</html>
